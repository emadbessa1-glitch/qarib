# بيبني ملف APK تلقائي مع كل تعديل على main، وبيحطه في صفحة Releases باسم "latest".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # مفتاح التوقيع الثابت (من Settings > Secrets). من غيره الموبايل يرفض التحديث فوق النسخة القديمة.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/qarib-upload.jks
            printf 'storeFile=qarib-upload.jks\nstorePassword=%s\nkeyAlias=qarib\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Signing with the release key"
          else
            echo "::warning::No signing key secrets; building with a temporary debug key"
          fi

      - name: Generate Android project files
        run: |
          flutter create . --platforms android --org com.qarib --project-name qarib
          dart run tool/setup_android.dart

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: qarib-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk qarib.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest qarib.apk \
            --title "قريب - آخر نسخة" \
            --notes "نسخة رقم ${{ github.run_number }} اتبنت تلقائي من آخر تعديل (${GITHUB_SHA::7}). نزّل qarib.apk على الموبايل وسطّبه.

          build=${{ github.run_number }}"
