name: qarib
description: "قريب - دليل الخدمات القريبة منك: صيدليات، سوبر ماركت، دكاترة، مدارس، سناتر."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Map (OpenStreetMap - no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location, calls, WhatsApp, directions
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # حفظ إن المستخدم سجّل بياناته
  shared_preferences: ^2.3.3

  # Backend (used only when AppConfig.useFirebase = true)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
